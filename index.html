<body>

<div class="app">

  <div class="header">

    <div class="brand">

<script>

const tg =
  window.Telegram.WebApp;

tg.ready();
tg.expand();


const API_URL =
  'https://script.google.com/macros/s/AKfycbxQ4gTtby8NVLuEieaKttbTjlLcyqQnTMz6KNjAT2JcSIe0PjAHpJfAX0BZAQq001A/exec';


const content =
  document.getElementById('content');

const adminName =
  document.getElementById('adminName');


/* ==========================================
   СОСТОЯНИЕ ТЕКУЩЕГО ЭКРАНА
   ========================================== */

let currentScreen = 'dashboard';

let dashboardRefreshTimer = null;

let currentGiveawayId = '';


/* ==========================================
   HELPERS
   ========================================== */

function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function formatDate(value) {

  if (!value) {
    return '—';
  }

  const d =
    new Date(value);

  if (isNaN(d.getTime())) {
    return String(value);
  }

  return d.toLocaleString(
    'ru-RU',
    {
      day: '2-digit',
      month: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    }
  );

}


/* ==========================================
   API
   ========================================== */

async function callApi(
  api,
  extra = {}
) {

  if (!tg.initData) {

    throw new Error(
      'Telegram initData пуст'
    );

  }


  const params =
    new URLSearchParams();


  params.set(
    'api',
    api
  );


  params.set(
    'initData',
    tg.initData
  );


  Object.keys(extra).forEach(
    function(key) {

      params.set(
        key,
        extra[key]
      );

    }
  );


  const response =
    await fetch(
      API_URL +
      '?' +
      params.toString()
    );


  if (!response.ok) {

    throw new Error(
      'HTTP ' +
      response.status
    );

  }


  const text =
    await response.text();


  let data;

  try {

    data =
      JSON.parse(text);

  } catch (e) {

    throw new Error(
      'Сервер вернул не JSON:\n' +
      text.substring(0, 300)
    );

  }


  return data;

}


/* ==========================================
   ERROR
   ========================================== */

function showError(error) {

  content.innerHTML = `

    <div class="error">

      ❌ <b>Ошибка</b>

      <br><br>

      ${escapeHtml(
        error.message ||
        String(error)
      )}

    </div>

    <button
      class="primary"
      onclick="loadDashboard(true)"
      style="margin-top:12px;"
    >
      🔄 Повторить
    </button>

  `;

}


/* ==========================================
   FINISHED GIVEAWAY
   ========================================== */

function renderFinishedGiveaway(giveaway) {

  currentGiveawayId = '';

  currentScreen = 'history-detail';

  const winners =
    giveaway.winners_list || [];

  const prizes =
    giveaway.prizes || [];


  /* ------------------------------------------
     ПОБЕДИТЕЛИ
     ------------------------------------------ */

  let winnersHtml = '';


  if (winners.length) {

    winnersHtml =
      winners.map(function(winner) {

        const name =
          winner.username
            ? '@' + winner.username
            : (
                winner.telegram_id ||
                'Пользователь'
              );


        const winnerContent = `

          <div class="muted">
            🏆 ${escapeHtml(
              winner.place
            )} место
          </div>

          <div class="title">
            ${escapeHtml(name)}
          </div>

          <div class="id">
            🎁 ${escapeHtml(
              winner.prize ||
              'Приз'
            )}
          </div>

        `;


        /*
         * Если есть username —
         * вся карточка становится ссылкой.
         */

        if (winner.username) {

          return `

            <a
              href="https://t.me/${encodeURIComponent(
                winner.username
              )}"
              target="_blank"
              style="
                display:block;
                text-decoration:none;
                color:inherit;
              "
            >

              <div
                class="card"
                style="cursor:pointer;"
              >
                ${winnerContent}
              </div>

            </a>

          `;

        }


        /*
         * Если username нет —
         * обычная карточка.
         */

        return `

          <div class="card">
            ${winnerContent}
          </div>

        `;

      }).join('');

  } else {

    winnersHtml = `

      <div class="card">

        <div class="muted">
          Победители не записаны.
        </div>

      </div>

    `;

  }


  /* ------------------------------------------
     ПРИЗЫ
     ------------------------------------------ */

  let prizesHtml = '';


  if (prizes.length) {

    prizesHtml =
      prizes.map(function(prize) {

        return `

          <div class="card">

            <div class="muted">
              ${escapeHtml(
                prize.place
              )} место
            </div>

            <div class="title">
              ${escapeHtml(
                prize.title ||
                'Приз'
              )}
            </div>

            <div class="muted">
              ${escapeHtml(
                prize.description ||
                ''
              )}
            </div>

          </div>

        `;

      }).join('');

  }


  /* ------------------------------------------
     ЭКРАН
     ------------------------------------------ */

  content.innerHTML = `

    <div class="card">

      <div class="status">

        <div class="muted">
          Последний розыгрыш
        </div>

        <div class="badge">
          🏁 ЗАВЕРШЁН
        </div>

      </div>


      <div class="title">
        ${escapeHtml(
          giveaway.title ||
          'DRIFT TAXI'
        )}
      </div>


      <div class="id">
        ID:
        ${escapeHtml(
          giveaway.giveaway_id ||
          '—'
        )}
      </div>

    </div>


    <div class="stats">

      <div class="stat">

        <div class="stat-value">
          ${Number(
            giveaway.participants ||
            0
          )}
        </div>

        <div class="stat-label">
          Участников
        </div>

      </div>


      <div class="stat">

        <div class="stat-value">
          ${Number(
            giveaway.tickets ||
            0
          )}
        </div>

        <div class="stat-label">
          Тикетов
        </div>

      </div>


      <div class="stat">

        <div class="stat-value">
          ${Number(
            giveaway.referrals ||
            0
          )}
        </div>

        <div class="stat-label">
          Приглашений
        </div>

      </div>


      <div class="stat">

        <div class="stat-value">
          ${Number(
            giveaway.winners_count ||
            0
          )}
        </div>

        <div class="stat-label">
          Победителей
        </div>

      </div>

    </div>


    <div class="card">

      <div class="muted">
        Период
      </div>

      <div
        style="
          margin-top:10px;
          line-height:1.8;
          font-size:14px;
        "
      >

        Начало:
        <b>
          ${escapeHtml(
            formatDate(
              giveaway.start_at
            )
          )}
        </b>

        <br>

        Окончание:
        <b>
          ${escapeHtml(
            formatDate(
              giveaway.end_at
            )
          )}
        </b>

        <br>

        Розыгрыш проведён:
        <b>
          ${escapeHtml(
            formatDate(
              giveaway.drawn_at
            )
          )}
        </b>

      </div>

    </div>


    <div class="section-title">
      🏆 Победители
    </div>


    ${winnersHtml}


    ${
      prizesHtml
        ? `

          <div class="section-title">
            🎁 Призы
          </div>

          ${prizesHtml}

        `
        : ''
    }


    <div class="section-title">
      Управление
    </div>


    <button
      onclick="refreshActiveGiveaway()"
    >
      🔄 Обновить
    </button>


    <button
      class="primary"
      onclick="drawActiveFromMiniApp()"
    >
      🎲 Провести розыгрыш сейчас
    </button>


    <button
      onclick="cancelActiveFromMiniApp()"
      style="background:#3a1717;color:#ff6b63;"
    >
      🛑 Остановить без розыгрыша
    </button>


    <button
      onclick="showHistory()"
    >
      📚 История розыгрышей
    </button>


    <button
      class="primary"
      onclick="showCreateForm()"
    >
      🎁 Создать новый розыгрыш
    </button>

  `;

}


/* ==========================================
   HISTORY
   ========================================== */

async function showHistory() {

  currentScreen = 'history';


  content.innerHTML = `

    <div class="loading">
      🔄 Загружаем историю...
    </div>

  `;


  try {

    const data =
      await callApi(
        'history'
      );


    if (
      !data ||
      data.ok === false
    ) {

      throw new Error(
        data &&
        data.error
          ? data.error
          : 'Не удалось загрузить историю'
      );

    }


    renderHistory(
      data.history || []
    );


  } catch (error) {

    console.error(error);

    showError(error);

  }

}


function renderHistory(history) {

  currentScreen = 'history';


  if (!history.length) {

    content.innerHTML = `

      <div class="card">

        <div class="title">
          📚 История розыгрышей
        </div>

        <div class="muted">
          Завершённых розыгрышей пока нет.
        </div>

      </div>


      <button
        class="primary"
        onclick="goDashboard()"
      >
        ← Назад
      </button>

    `;

    return;

  }


  let html = '';


  history.forEach(
    function(giveaway) {

      html += `

        <div
          class="card"
          onclick="openHistoryGiveaway('${String(
            giveaway.giveaway_id
          ).replace(/'/g, "\\'")}')"
          style="
            cursor:pointer;
            margin-bottom:12px;
          "
        >

          <div class="status">

            <div class="muted">
              🏁 Завершён
            </div>

            <div class="badge">
              РЕЗУЛЬТАТЫ
            </div>

          </div>


          <div class="title">

            ${escapeHtml(
              giveaway.title ||
              'DRIFT TAXI'
            )}

          </div>


          <div class="id">

            ID:
            ${escapeHtml(
              giveaway.giveaway_id ||
              '—'
            )}

          </div>


          <div
            style="
              margin-top:12px;
              display:grid;
              grid-template-columns:1fr 1fr;
              gap:8px;
            "
          >

            <div class="muted">
              👥 ${Number(
                giveaway.participants ||
                0
              )} участников
            </div>


            <div class="muted">
              🎟 ${Number(
                giveaway.tickets ||
                0
              )} тикетов
            </div>


            <div class="muted">
              📤 ${Number(
                giveaway.referrals ||
                0
              )} приглашений
            </div>


            <div class="muted">
              🏆 ${Number(
                giveaway.winners_count ||
                0
              )} победителей
            </div>

          </div>


          <div
            class="muted"
            style="margin-top:12px;"
          >

            ${escapeHtml(
              formatDate(
                giveaway.drawn_at ||
                giveaway.end_at
              )
            )}

          </div>

        </div>

      `;

    }
  );


  content.innerHTML = `

    <div
      style="
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin-bottom:14px;
      "
    >

      <div class="title">
        📚 История
      </div>

    </div>


    ${html}


    <button
      class="primary"
      onclick="goDashboard()"
    >
      ← Назад
    </button>

  `;

}


/* ==========================================
   OPEN HISTORY GIVEAWAY
   ========================================== */

async function openHistoryGiveaway(
  giveawayId
) {

  currentScreen =
    'history-detail';


  content.innerHTML = `

    <div class="loading">
      🔄 Загружаем результаты...
    </div>

  `;


  try {

    const data =
      await callApi(
        'giveaway',
        {
          id:
            giveawayId
        }
      );


    if (
      !data ||
      data.ok === false
    ) {

      throw new Error(
        data &&
        data.error
          ? data.error
          : 'Не удалось загрузить розыгрыш'
      );

    }


    renderFinishedGiveaway(
      data.giveaway
    );


  } catch (error) {

    console.error(error);

    showError(error);

  }

}


/* ==========================================
   EMPTY DASHBOARD
   ========================================== */

function renderEmptyDashboard() {

  currentGiveawayId = '';

  currentScreen =
    'dashboard';


  content.innerHTML = `

    <div class="card">

      <div class="title">
        🚗 DRIFT TAXI
      </div>

      <div class="muted">
        Сейчас нет активных или завершённых розыгрышей.
      </div>

    </div>


    <button
      class="primary"
      onclick="showCreateForm()"
    >
      🎁 Создать новый розыгрыш
    </button>

  `;

}


/* ==========================================
   DASHBOARD
   ========================================== */

function renderDashboard(data) {

  currentScreen =
    'dashboard';


  if (data.ok === false) {

    showError(
      new Error(
        data.error ||
        'Неизвестная ошибка'
      )
    );

    return;

  }


  /* ------------------------------------------
     АДМИНИСТРАТОР
     ------------------------------------------ */

  if (data.user) {

    adminName.textContent =
      data.user.username
        ? '@' + data.user.username
        : (
            data.user.first_name ||
            'admin'
          );

  }


  /* ------------------------------------------
     АКТИВНЫЙ / ЗАВЕРШЁННЫЙ
     ------------------------------------------ */

  const giveaway =
    data.giveaway;

  currentGiveawayId =
    giveaway && giveaway.giveaway_id
      ? String(giveaway.giveaway_id)
      : '';

  const finishedGiveaway =
    data.finishedGiveaway;


  /*
   * Если активного нет,
   * показываем последний завершённый.
   */

  if (!giveaway) {

    if (finishedGiveaway) {

      renderFinishedGiveaway(
        finishedGiveaway
      );

    } else {

      renderEmptyDashboard();

    }

    return;

  }


  /* ------------------------------------------
     СТАТУС
     ------------------------------------------ */

  const status =
    giveaway.status ||
    'UNKNOWN';


  const statusText = {

    ACTIVE:
      'АКТИВЕН',

    SCHEDULED:
      'ЗАПЛАНИРОВАН',

    FINISHED:
      'ЗАВЕРШЁН',

    CANCELLED:
      'ОТМЕНЁН'

  }[
    status
  ] || status;


  /* ------------------------------------------
     DASHBOARD
     ------------------------------------------ */

  content.innerHTML = `

    <div class="card">

      <div class="status">

        <div class="muted">
          Текущий розыгрыш
        </div>

        <div class="badge">
          ${escapeHtml(
            statusText
          )}
        </div>

      </div>


      <div class="title">

        ${escapeHtml(
          giveaway.title ||
          giveaway.name ||
          'DRIFT TAXI'
        )}

      </div>


      <div class="id">

        ID:
        ${escapeHtml(
          giveaway.giveaway_id ||
          '—'
        )}

      </div>

    </div>


    <div class="stats">

      <div class="stat">

        <div class="stat-value">
          ${Number(
            giveaway.participants ||
            0
          )}
        </div>

        <div class="stat-label">
          Участников
        </div>

      </div>


      <div class="stat">

        <div class="stat-value">
          ${Number(
            giveaway.tickets ||
            0
          )}
        </div>

        <div class="stat-label">
          Тикетов
        </div>

      </div>


      <div class="stat">

        <div class="stat-value">
          ${Number(
            giveaway.referrals ||
            0
          )}
        </div>

        <div class="stat-label">
          Приглашений
        </div>

      </div>


      <div class="stat">

        <div class="stat-value">
          ${Number(
            giveaway.winners_count ||
            0
          )}
        </div>

        <div class="stat-label">
          Победителей
        </div>

      </div>

    </div>


    <div class="card">

      <div class="muted">
        Период
      </div>


      <div
        style="
          margin-top:10px;
          line-height:1.8;
          font-size:14px;
        "
      >

        Начало:

        <b>
          ${escapeHtml(
            formatDate(
              giveaway.start_at
            )
          )}
        </b>


        <br>


        Окончание:

        <b>
          ${escapeHtml(
            formatDate(
              giveaway.end_at
            )
          )}
        </b>

      </div>

    </div>


    <div class="section-title">
      Управление
    </div>


    <button
      onclick="showHistory()"
    >
      📚 История розыгрышей
    </button>


    <button
      class="primary"
      onclick="showCreateForm()"
    >
      🎁 Создать новый розыгрыш
    </button>

  `;

}


/* ==========================================
   УПРАВЛЕНИЕ АКТИВНЫМ РОЗЫГРЫШЕМ
   ========================================== */

async function refreshActiveGiveaway() {

  await loadDashboard(true);

}


async function drawActiveFromMiniApp() {

  const giveawayId =
    currentGiveawayId;

  if (!giveawayId) {

    tg.showAlert(
      'Активный розыгрыш не найден.'
    );

    return;

  }

  const confirmed =
    confirm(
      '🎲 Провести розыгрыш сейчас?\n\n' +
      'После этого будут выбраны победители, ' +
      'а розыгрыш завершится.'
    );

  if (!confirmed) {
    return;
  }

  try {

    const result =
      await callApi(
        'drawGiveaway',
        {
          id: giveawayId
        }
      );

    if (
      !result ||
      result.ok === false
    ) {

      throw new Error(
        result && result.error
          ? result.error
          : 'Не удалось провести розыгрыш.'
      );

    }

    tg.showAlert(
      '🎉 Победители выбраны!'
    );

    currentGiveawayId = '';

    await loadDashboard(true);

  } catch (error) {

    showError(error);

  }

}


async function cancelActiveFromMiniApp() {

  const giveawayId =
    currentGiveawayId;

  if (!giveawayId) {

    tg.showAlert(
      'Активный розыгрыш не найден.'
    );

    return;

  }

  const confirmed =
    confirm(
      '🛑 Остановить розыгрыш без выбора победителей?\n\n' +
      'Он будет завершён как отменённый.'
    );

  if (!confirmed) {
    return;
  }

  try {

    const result =
      await callApi(
        'cancelGiveaway',
        {
          id: giveawayId
        }
      );

    if (
      !result ||
      result.ok === false
    ) {

      throw new Error(
        result && result.error
          ? result.error
          : 'Не удалось остановить розыгрыш.'
      );

    }

    tg.showAlert(
      'Розыгрыш остановлен.'
    );

    currentGiveawayId = '';

    await loadDashboard(true);

  } catch (error) {

    showError(error);

  }

}

/* ==========================================
   ADD PRIZE
   ========================================== */

function addPrize() {

  const container =
    document.getElementById(
      'prizes'
    );


  if (!container) {
    return;
  }


  const number =
    container.children.length +
    1;


  const div =
    document.createElement(
      'div'
    );


  div.className =
    'prize';


  div.innerHTML = `

    <div class="prize-head">

      <div class="prize-number">
        Приз ${number}
      </div>


      <button
        class="remove"
        onclick="
          this.parentElement
            .parentElement
            .remove()
        "
      >
        Удалить
      </button>

    </div>


    <label>
      Название приза
    </label>


    <input
      class="prize-title"
      type="text"
      placeholder="Например: поездка на DRIFT TAXI"
    >


    <label>
      Описание
    </label>


    <textarea
      class="prize-description"
      placeholder="Описание приза"
    ></textarea>

  `;


  container.appendChild(
    div
  );

}


/* ==========================================
   CREATE GIVEAWAY
   ========================================== */

async function createGiveaway() {

  const button =
    document.getElementById(
      'createButton'
    );


  const title =
    document.getElementById(
      'title'
    ).value.trim();


  const description =
    document.getElementById(
      'description'
    ).value.trim();


  const start =
    document.getElementById(
      'start'
    ).value;


  const end =
    document.getElementById(
      'end'
    ).value;


  const winners =
    Number(
      document.getElementById(
        'winners'
      ).value
    );


  const autoDraw =
    document.getElementById(
      'autoDraw'
    ).checked;


  /* ------------------------------------------
     ПРОВЕРКИ
     ------------------------------------------ */

  if (!title) {

    tg.showAlert(
      'Укажи название розыгрыша.'
    );

    return;

  }


  if (!start || !end) {

    tg.showAlert(
      'Укажи дату и время начала и окончания.'
    );

    return;

  }


  if (
    new Date(end) <=
    new Date(start)
  ) {

    tg.showAlert(
      'Окончание должно быть позже начала.'
    );

    return;

  }


  if (
    !winners ||
    winners < 1
  ) {

    tg.showAlert(
      'Количество победителей должно быть не меньше 1.'
    );

    return;

  }


  /* ------------------------------------------
     ПРИЗЫ
     ------------------------------------------ */

  const prizeElements =
    document.querySelectorAll(
      '.prize'
    );


  const prizes = [];


  prizeElements.forEach(
    function(
      element,
      index
    ) {

      const prizeTitle =
        element
          .querySelector(
            '.prize-title'
          )
          .value
          .trim();


      const prizeDescription =
        element
          .querySelector(
            '.prize-description'
          )
          .value
          .trim();


      if (prizeTitle) {

        prizes.push({

          place:
            index + 1,

          title:
            prizeTitle,

          description:
            prizeDescription

        });

      }

    }
  );


  if (!prizes.length) {

    tg.showAlert(
      'Добавь хотя бы один приз.'
    );

    return;

  }


  /* ------------------------------------------
     DATA
     ------------------------------------------ */

  const data = {

    title:
      title,

    description:
      description,

    start:
      start,

    end:
      end,

    winners:
      winners,

    prizes:
      prizes,

    autoDraw:
      autoDraw

  };


  /* ------------------------------------------
     SEND
     ------------------------------------------ */

  try {

    button.disabled =
      true;


    button.textContent =
      '⏳ Создаём...';


    const result =
      await callApi(
        'createGiveaway',
        {
          data:
            JSON.stringify(
              data
            )
        }
      );


    if (
      !result ||
      result.ok === false
    ) {

      throw new Error(
        result &&
        result.error
          ? result.error
          : 'Не удалось создать розыгрыш'
      );

    }


    tg.showAlert(
      '🎉 Розыгрыш создан!'
    );


    await loadDashboard(true);


  } catch (error) {

    button.disabled =
      false;


    button.textContent =
      '🚀 Создать розыгрыш';


    showError(error);

  }

}



/* ==========================================
   НАЗАД НА ГЛАВНЫЙ ЭКРАН
   ========================================== */

function goDashboard() {

  currentScreen = 'dashboard';

  loadDashboard(true);

}


/* ==========================================
   LOAD DASHBOARD
   ========================================== */

async function loadDashboard(
  showLoading = true
) {

  /*
   * Если пользователь сейчас находится
   * в истории или в форме создания,
   * автоматический refresh не должен
   * перерисовывать экран.
   */

  if (
    !showLoading &&
    currentScreen !== 'dashboard'
  ) {

    return;

  }


  try {

    if (showLoading) {

      content.innerHTML = `

        <div class="loading">
          🔄 Загружаем админку...
        </div>

      `;

    }


    const data =
      await callApi(
        'dashboard'
      );


    renderDashboard(
      data
    );


  } catch (error) {

    console.error(error);


    /*
     * При автообновлении не уничтожаем
     * уже рабочую админку.
     */

    if (showLoading) {

      showError(error);

    }

  }

}


/* ==========================================
   AUTO REFRESH
   ========================================== */

function startDashboardAutoRefresh() {

  if (dashboardRefreshTimer) {

    return;

  }


  dashboardRefreshTimer =
    setInterval(
      function() {

        /*
         * Автообновляем только главный
         * экран Dashboard.
         *
         * История, результаты и форма
         * создания не перерисовываются.
         */

        if (
          currentScreen !==
          'dashboard'
        ) {

          return;

        }


        loadDashboard(false);

      },
      3000
    );

}


/* ==========================================
   FIRST LOAD
   ========================================== */

loadDashboard(true);

startDashboardAutoRefresh();


/* ==========================================
   RETURN TO MINI APP
   ========================================== */

document.addEventListener(
  'visibilitychange',
  function() {

    if (!document.hidden) {

      /*
       * Если вернулись именно
       * на главный экран —
       * обновляем его.
       */

      if (
        currentScreen ===
        'dashboard'
      ) {

        loadDashboard(false);

      }

    }

  }
);

</script>
